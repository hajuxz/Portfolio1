      <stop offset=".57" stop-color="#2b84a2"/><stop offset="1" stop-color="#193552"/>
    </linearGradient>
    <pattern id="scales" width="3" height="3.6" patternUnits="userSpaceOnUse" patternTransform="scale(.48)">
      <rect width="3" height="3.6" fill="#112e43"/>
      <g fill="url(#scale)" stroke="#1a404d" stroke-width=".16">
        <path d="M0 -1.8Q1.2 -1.7 1.5 -.8Q1.4 .35 0 1Q-1.4 .35 -1.5 -.8Q-1.2 -1.7 0 -1.8ZM3 -1.8Q4.2 -1.7 4.5 -.8Q4.4 .35 3 1Q1.6 .35 1.5 -.8Q1.8 -1.7 3 -1.8Z"/>
        <path d="M1.5 0Q2.7 .1 3 1Q2.9 2.15 1.5 2.8Q.1 2.15 0 1Q.3 .1 1.5 0ZM0 1.8Q1.2 1.9 1.5 2.8Q1.4 3.95 0 4.6Q-1.4 3.95 -1.5 2.8Q-1.2 1.9 0 1.8ZM3 1.8Q4.2 1.9 4.5 2.8Q4.4 3.95 3 4.6Q1.6 3.95 1.5 2.8Q1.8 1.9 3 1.8Z"/>
      </g>
